name: Verify OTA Distribution

on:
  pull_request:
    paths:
      - 'download-sources.v1.json'
      - 'ota-manifest.v1.json'
      - 'verify_download_paths.py'
      - 'tests/test_verify_download_paths.py'
      - '.github/workflows/verify-download-paths.yml'
  push:
    branches: [main]
    paths:
      - 'download-sources.v1.json'
      - 'ota-manifest.v1.json'
      - 'verify_download_paths.py'
      - 'tests/test_verify_download_paths.py'
      - '.github/workflows/verify-download-paths.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest tests.test_verify_download_paths -v

      - name: Download and verify configured PCR02 OTA sources
        run: |
          python verify_download_paths.py \
            --manifest ota-manifest.v1.json \
            --sources download-sources.v1.json \
            --output ota-download-verification-receipt.json

      - name: Check distribution receipt boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('ota-download-verification-receipt.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['product_id'] == 'PCR02'
          assert receipt['version'] == 'v1.1.21'
          assert receipt['artifact_size_bytes'] == 76778472
          assert receipt['artifact_sha256'] == '7687d8058f85271e75ff3726957385afa1618aa2078dc0a6b3215d470af4a4bb'
          assert receipt['source_commit'] == 'eeb926bd1fff75d2a5d5abb9f0ede9c8f582cc6d'
          assert len(receipt['sources']) == 2
          assert all(item['status'] == 'PASS' for item in receipt['sources'])
          assert all(item['final_url'].startswith('https://') for item in receipt['sources'])
          PY

      - name: Retain PCR02 OTA distribution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcr02-ota-distribution-receipt
          path: ota-download-verification-receipt.json
          if-no-files-found: error
          retention-days: 30
